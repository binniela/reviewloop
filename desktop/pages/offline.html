<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'" />
    <title>Offline · Reviewloop</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="drag"></div>
    <main>
      <div class="eyebrow"><span>[!]</span>Connection<i></i></div>
      <h1>Can't reach Reviewloop.</h1>
      <p>Check the internet connection at the desk. Guest texts are still being received and will be here when you're back.</p>
      <p id="where" class="small"></p>
      <div class="row">
        <button type="button" id="retry">Try again</button>
      </div>
    </main>
    <script src="offline.js"></script>
  </body>
</html>
